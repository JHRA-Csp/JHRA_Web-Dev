<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Advaced Notes</title>
        <meta charset="UTF-8">
        <style>
            /*Cascading style sheets
            1. Selector = says what to change
            2. Declaration = A property(what about the element to change) and value(How to change it)
            */
            body{
                color:rgb(202, 202, 202);
                background-color:rgb(1, 0, 14);
                border: dashed 1px rgb(202, 202, 202);
                font-family:'Times New Roman', Times, serif;
                font-weight: 900
            }
            h1{
                text-align: center;}
            #even{color: rgb(150, 150, 150);
                text-decoration: underline;}
            .list{width: 50%;
                background-color: rgb(0, 20, 110);
                border-radius: 4px;
                font-size: 2rem
            }
        </style>
    </head>
    <body>
        <H1>HTML Advaced Notes</H1>
        <H3>Lists:</H3>
        <div> 
        <ol type="I">
            <li>Alex</li>

        </ol>
        <ul>
            <li>Apple</li>
            <li id="even">Orange</li>
            <li>Banana</li>
            <li id="even">Peach</li>
        </ul>
        <dl>
            <dt>Fall</dt>

            <dd>Thanksgiving</dd>
            <dt id="even">Christmas</dt>
            <dd>Hanukkah</dd>
            <dd id="even">New Years</dd>
        </dl>
        </div>
