<!DOCTYPE html>
<html lang = "en">
    <style> 
    h1{
        text-align: center;
    }
.box {width: 50%;
        background-color: rgb(0, 20, 110);

        border: solid;
        border-color: chocolate;
        border-width: 5px;
    }
.Analogous {width: 50%;
        background-color: rgb(139, 0, 0);
        border-radius: 5px;
        border: solid;
        border-color: rgb(103, 0, 134);

    }
.Triadic {width: 50%;
        background-color: Red;
        border-radius: 5px;
        border: solid;
        border-color: Blue;
        border-width: 5px;
    }
</style>
    <head>
        <title>Colour Theory</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Colour theory</h1>
        <div class="box">
        <h1>
            Complemetery
        </h1>
    </div>
    <div class="Analogous">
        <h1>
            Analogous
        </h1>
    </div>
    <div class="Triadic">
        <h1>
            Triadic
        </h1>
    </div>

    </body>
</html>
